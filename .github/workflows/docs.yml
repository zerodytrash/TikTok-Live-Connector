name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'README.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [ts-rewrite]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Deployment runs only where the Cloudflare secrets exist; forks and pull requests skip it.
      DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@10.34.2
      - name: Install library dependencies
        run: pnpm install --frozen-lockfile
      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: Validate and build documentation
        run: pnpm --dir docs build
      - name: Upload site for review
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/dist
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ts-rewrite' && env.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          packageManager: pnpm
          command: deploy
